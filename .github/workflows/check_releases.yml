name: Vérification des parutions (ANIME//DB)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-releases
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les données du dépôt
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 🟢 ÉTAPE AJOUTÉE ICI :
      - name: Installer les dépendances (Cheerio, etc.)
        run: npm install

      - name: Vérifier les parutions manga/webtoon et notifier
        run: node scripts/check-releases.js data.json notif-config.json --write

      - name: Vérifier les sorties anime (AniList) et notifier
        run: node scripts/check-anime-releases.js data.json notif-config.json --write

      - name: Commiter les mises à jour de suivi
        run: |
          git config user.name "anime-db-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json
            git commit -m "chore: mise à jour automatique des parutions (manga + anime)"
            git push
          else
            echo "Rien de nouveau à commiter."
          fi
